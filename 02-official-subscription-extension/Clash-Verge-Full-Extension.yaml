# Clash Verge Rev / Mihomo 官方订阅扩展版（不含节点）
# 机场官方远程订阅负责节点；本扩展接管 DNS、策略组和分流规则。
# 策略组通过 include-all 动态读取官方订阅里的节点。


mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# Windows 建议在 Clash Verge Rev 中启用服务模式后使用 TUN。
# strict-route 会针对 Windows 多宿主 DNS 行为添加防泄漏规则。
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  endpoint-independent-nat: false

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # rule 模式只给少数兼容性域名返回真实 IP，其余使用 Fake-IP。
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,lan_non_ip,real-ip
    - DOMAIN,localhost,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN,time.windows.com,real-ip
    - DOMAIN,time.apple.com,real-ip
    - DOMAIN-SUFFIX,ntp.org,real-ip
    # 微信及腾讯图片/文件 CDN 对 Fake-IP 较敏感，使用真实 IP 提升传输兼容性。
    - DOMAIN-SUFFIX,wechat.com,real-ip
    - DOMAIN-SUFFIX,weixin.com,real-ip
    - DOMAIN-SUFFIX,weixinbridge.com,real-ip
    - DOMAIN-SUFFIX,qq.com,real-ip
    - DOMAIN-SUFFIX,qpic.cn,real-ip
    - DOMAIN-SUFFIX,qlogo.cn,real-ip
    - DOMAIN-SUFFIX,gtimg.com,real-ip
    - DOMAIN-SUFFIX,tencent.com,real-ip
    - DOMAIN-SUFFIX,qcloud.com,real-ip
    - DOMAIN-SUFFIX,myqcloud.com,real-ip
    - DOMAIN-SUFFIX,tencent-cloud.net,real-ip
    - MATCH,fake-ip

  # DNS 上游连接遵守路由规则。国际 DoH 被明确送入 PROXY。
  respect-rules: true

  # 仅用于 DNS 上游域名的引导解析；这里使用 IP 形式的加密 DNS。
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  # 代理节点域名必须先通过可直连的加密 DNS 解析，避免“先有代理还是先解析节点”的循环。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT

  # 直连应用使用国内加密 DNS，避免微信等国内服务拿到境外解析结果。
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
  direct-nameserver-follow-policy: true

  # 国内/局域网规则使用国内加密 DNS；不回退到系统 DNS。
  nameserver-policy:
    'rule-set:lan_non_ip,direct_non_ip,domestic_non_ip,apple_cn,apple_cdn,apple_services,microsoft_cdn,microsoft_non_ip':
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT
    '+.cn':
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT
    '+.skk.moe':
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT

  # 默认国际 DNS：DoH 本身也经代理发送。
  nameserver:
    - https://1.1.1.1/dns-query#PROXY
    - https://8.8.8.8/dns-query#PROXY

proxy-groups:
  - name: PROXY
    type: select
    default-selected: AUTO
    proxies:
      - AUTO
      - 🇭🇰 香港
      - 🇸🇬 新加坡
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 🇹🇼 台湾
      - 🇰🇷 韩国
      - 🇪🇺 欧洲
      - 🧭 全部节点
      - DIRECT

  - name: AUTO
    type: url-test
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    timeout: 5000
    expected-status: 204
    empty-fallback: REJECT

  - name: 🧭 全部节点
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    empty-fallback: REJECT

  - name: 🇭🇰 香港
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(香港|港|Hong[ -]?Kong|\bHK\b|\bHKG\b)'
    empty-fallback: REJECT

  - name: 🇸🇬 新加坡
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(新加坡|狮城|Singapore|\bSG\b|\bSIN\b)'
    empty-fallback: REJECT

  - name: 🇯🇵 日本
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(日本|东京|大阪|Japan|Tokyo|Osaka|\bJP\b|\bNRT\b)'
    empty-fallback: REJECT

  - name: 🇺🇸 美国
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖荷西|西雅图|西雅圖|纽约|紐約|United[ -]?States|America|Los[ -]?Angeles|San[ -]?Jose|Seattle|New[ -]?York|\bUS\b|\bUSA\b|\bLAX\b|\bSJC\b)'
    empty-fallback: REJECT

  - name: 🇹🇼 台湾
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(台湾|台灣|台北|Taiwan|Taipei|\bTW\b|\bTPE\b)'
    empty-fallback: REJECT

  - name: 🇰🇷 韩国
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(韩国|韓國|首尔|首爾|Korea|Seoul|\bKR\b|\bKOR\b|\bICN\b)'
    empty-fallback: REJECT

  - name: 🇪🇺 欧洲
    type: select
    include-all: true
    exclude-type: 'Direct|Reject|Pass|Compatible'
    exclude-filter: '(?i)(套餐|流量|剩余|到期|重置|官网|客服|traffic|expire|subscription)'
    filter: '(?i)(欧洲|歐洲|英国|英國|德国|德國|法国|法國|荷兰|荷蘭|瑞士|意大利|西班牙|芬兰|瑞典|挪威|波兰|Europe|United[ -]?Kingdom|Britain|Germany|France|Netherlands|Switzerland|Italy|Spain|Finland|Sweden|Norway|Poland|\bEU\b|\bUK\b|\bGB\b|\bDE\b|\bFR\b|\bNL\b)'
    empty-fallback: REJECT

  - name: 🤖 AI
    type: select
    default-selected: 🇺🇸 美国
    proxies:
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - PROXY
      - DIRECT

  - name: ✈️ Telegram
    type: select
    default-selected: 🇸🇬 新加坡
    proxies:
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇯🇵 日本
      - PROXY
      - DIRECT

  - name: 🎬 Streaming
    type: select
    default-selected: PROXY
    proxies:
      - PROXY
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇰🇷 韩国
      - 🇪🇺 欧洲
      - DIRECT

  - name: 🍎 Apple
    type: select
    default-selected: DIRECT
    proxies:
      - DIRECT
      - PROXY
      - AUTO

  - name: 🪟 Microsoft
    type: select
    default-selected: DIRECT
    proxies:
      - DIRECT
      - PROXY
      - AUTO

  - name: 🚀 Speedtest
    type: select
    default-selected: DIRECT
    proxies:
      - DIRECT
      - PROXY
      - AUTO
      - 🧭 全部节点

  - name: 🇨🇳 国内应用
    type: select
    default-selected: DIRECT
    proxies:
      - DIRECT
      - PROXY

  # 选择 PASS 即可关闭对应拦截并继续匹配后续规则。扩展广告默认关闭。
  - name: 🛡️ 基础广告
    type: select
    default-selected: REJECT
    proxies:
      - REJECT
      - PASS

  - name: 🧱 扩展广告
    type: select
    default-selected: PASS
    proxies:
      - PASS
      - REJECT

  - name: 🎣 钓鱼防护
    type: select
    default-selected: REJECT
    proxies:
      - REJECT
      - PASS

  # 默认阻断常见 STUN 端口，降低 WebRTC 暴露真实网络地址的概率；视频通话异常时选 PASS。
  - name: 🔒 STUN 防护
    type: select
    default-selected: REJECT
    proxies:
      - REJECT
      - PASS

  - name: 🏁 FINAL
    type: select
    default-selected: PROXY
    proxies:
      - PROXY
      - DIRECT
      - REJECT

